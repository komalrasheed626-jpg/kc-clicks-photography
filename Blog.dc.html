<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"></link>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"></link>
<style>body{margin:0;background:#fdfbf8}</style>
</helmet>
<x-import component-from-global-scope="image-slot" from="./image-slot.js" hint-size="1,1" style="width:0;height:0;overflow:hidden;position:absolute"></x-import>
<div style="font-family:'Poppins',sans-serif;background:#fdfbf8;color:#161310">
  <dc-import name="Nav" active-page="blog" hint-size="100%,80px"></dc-import>

  <section style="padding:180px 56px 80px;max-width:1280px;margin:0 auto;text-align:center">
    <div style="font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#C41E2C;margin-bottom:16px">Blog</div>
    <h1 style="font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(34px,5vw,58px);margin:0 0 20px">Kahaniyan, Tips Aur Behind The Lens</h1>
    <p style="font-size:15px;color:#5a544c;max-width:520px;margin:0 auto">Photography ki dunya se kuch baatein, kuch sabaq, kuch yaadein.</p>
  </section>

  <section style="max-width:1200px;margin:0 auto;padding:0 56px 140px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:44px">
    <sc-for list="{{ posts }}" as="post" hint-placeholder-count="6">
      <a href="{{ post.href }}" style="text-decoration:none;color:#161310;display:block">
        <div style="width:100%;aspect-ratio:3/2;margin-bottom:20px;overflow:hidden">
          <image-slot id="{{ post.id }}" shape="rect" placeholder="{{ post.placeholder }}" style="width:100%;height:100%"></image-slot>
        </div>
        <div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#C41E2C;margin-bottom:10px">{{ post.date }} · {{ post.category }}</div>
        <div style="font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px;margin-bottom:10px;line-height:1.25">{{ post.title }}</div>
        <div style="font-size:14px;line-height:1.7;color:#5a544c">{{ post.excerpt }}</div>
      </a>
    </sc-for>
  </section>

  <dc-import name="Footer" hint-size="100%,340px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      posts: [
        { id: 'blog-1', placeholder: 'Wedding sunset', date: 'Jun 2026', category: 'Wedding', title: 'Nikkah Se Walima Tak: Ek Din Ki Kahani', excerpt: 'Ek shaadi ke din ko frame by frame kaise capture karte hain — hamara process.', href: '#' },
        { id: 'blog-2', placeholder: 'Camera gear', date: 'May 2026', category: 'Tips', excerpt: 'Golden hour mein portrait shoot karne ke 5 asaan tips.', title: 'Golden Hour Portraits: 5 Tips', href: '#' },
        { id: 'blog-3', placeholder: 'Baby portrait', date: 'Apr 2026', category: 'Behind The Lens', title: 'Baby Shoot Se Pehle Kya Tayyari Karein', excerpt: 'Nayi maa baap ke liye baby photography ki tayyari ka guide.', href: '#' },
        { id: 'blog-4', placeholder: 'Mountain trail', date: 'Mar 2026', category: 'Travel', title: 'Hunza Mein Ek Shoot Ki Yaadein', excerpt: 'Shumali ilaqon mein travel photography ka safarnama.', href: '#' },
        { id: 'blog-5', placeholder: 'Studio setup', date: 'Feb 2026', category: 'Studio', title: 'Studio Lighting Basics Jo Har Client Ko Pata Honi Chahiye', excerpt: 'Lighting setup jo aapki tasveeron ko premium look deta hai.', href: '#' },
        { id: 'blog-6', placeholder: 'Editing screen', date: 'Jan 2026', category: 'Editing', title: 'Raw Se Retouch Tak: Hamara Editing Process', excerpt: 'Har photo final hone se pehle kin marahil se guzarti hai.', href: '#' },
      ],
    };
  }
}
</script>
</body>
</html>
