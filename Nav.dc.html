<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"></link>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"></link>
</helmet>
<nav style="position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:22px 56px;background:{{ navBg }};backdrop-filter:blur(10px);font-family:'Poppins',sans-serif;transition:background .3s">
  <a href="Home.dc.html" style="display:flex;align-items:center;gap:10px;font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;letter-spacing:.04em;color:{{ textColor }};text-decoration:none;white-space:nowrap;flex-shrink:0">
    <img src="./assets/kc-logo.png" alt="KC Clicks logo" style="height:34px;width:auto;flex-shrink:0"/>
    KC Clicks
  </a>
  <div style="display:flex;align-items:center;gap:22px;flex-wrap:nowrap">
    <sc-for list="{{ links }}" as="link" hint-placeholder-count="5">
      <a href="{{ link.href }}" style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:{{ link.color }};text-decoration:none;padding-bottom:4px;border-bottom:1px solid {{ link.underline }};white-space:nowrap">{{ link.label }}</a>
    </sc-for>
    <a href="Booking.dc.html" style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:{{ goldColor }};padding:11px 24px;border-radius:2px;text-decoration:none;white-space:nowrap;flex-shrink:0">Book Now</a>
  </div>
</nav>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;activePage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;portfolio&quot;,&quot;about&quot;,&quot;services&quot;,&quot;blog&quot;,&quot;contact&quot;]},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const GOLD = '#C41E2C';
const PAGES = [
  { key: 'home', label: 'Home', href: 'Home.dc.html' },
  { key: 'portfolio', label: 'Portfolio', href: 'Portfolio.dc.html' },
  { key: 'about', label: 'About', href: 'About.dc.html' },
  { key: 'services', label: 'Services', href: 'About.dc.html#services' },
  { key: 'blog', label: 'Blog', href: 'Blog.dc.html' },
  { key: 'contact', label: 'Contact', href: 'Contact.dc.html' },
];
class Component extends DCLogic {
  renderVals() {
    const active = this.props.activePage ?? 'home';
    const dark = this.props.dark ?? false;
    const textColor = dark ? '#f7f4ef' : '#161310';
    return {
      navBg: dark ? 'transparent' : 'rgba(255,255,255,0.86)',
      textColor,
      goldColor: GOLD,
      links: PAGES.map(p => ({
        label: p.label, href: p.href,
        color: p.key === active ? GOLD : textColor,
        underline: p.key === active ? GOLD : 'transparent',
      })),
    };
  }
}
</script>
</body>
</html>
